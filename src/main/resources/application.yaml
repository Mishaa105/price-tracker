spring:
  application:
    name: price-tracker

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    deserialization:
      ACCEPT_SINGLE_VALUE_AS_ARRAY: true

app:
  playstation:
    base-url: https://store.playstation.com